name: Build and Release
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
env:
  CARGO_TERM_COLOR: always
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y clang llvm libbpf-dev linux-headers-generic
    - name: Build
      run: cargo build --verbose
    - name: Check with ebpf feature
      run: cargo check --features ebpf --verbose
    # 发布门禁: clippy warning 一律硬拦 (clippy-cleanup 已清零, 刻意/组织性模式在源码里逐条
    # #[allow] 带理由)。新增 warning 会红 CI, 逼提交时处理。
    - name: Clippy
      run: cargo clippy --all-targets -- -D warnings
    - name: Run tests
      run: cargo test --verbose
    # crypto 相对吞吐哨兵: AES-NI 机器上 AES/ChaCha 比值应 ≥1.3× (实测 ~2×)。用比值抗计时噪声,
    # 抓 AES 硬件加速丢失/ring 算法配错 = cipher agility 选 AES 的前提崩了。release + 显式点名
    # (避开 resolver.rs 的其它 #[ignore])。brutal 场景哨兵是普通 #[test] 已在 Run tests 覆盖。
    - name: Crypto 相对吞吐哨兵 (AES/ChaCha 比值)
      run: cargo test --release aes_chacha_throughput_ratio_sentinel -- --ignored --nocapture

  # 透明代理 eBPF 机制的 netns 集成验证。
  #
  # 为什么需要: 单测覆盖不到 tc_divert / sk_lookup / sk_assign / cgroup-connect4 这些**内核
  # 行为** —— 它们只能在真 netns + 真 BPF 加载下验。此前这些验证器只能手动跑, 旗舰的透明代理
  # 路径每次改动都在裸奔。
  #
  # ⚠️ 接入前提 (2026-07-17): 这些验证器原先**只 println PASS/FAIL、从不返回非零退出码** ——
  # 直接进 CI 会永远绿灯 (假信心, 比没有 CI 更糟)。已先改成用退出码表达结论才接进来。
  #
  # 跑在 ubuntu-22.04 (内核 5.15) 是**故意的**: 贴近 README 声称的最低支持内核 (≥5.10), 让 CI
  # 真正检验那个支持声明, 而不是只在最新内核上自我感觉良好。
  ebpf-verify:
    name: eBPF netns 验证器 (透明代理内核机制)
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        sudo apt-get update
        # nftables: 给 verify_tc_divert_orphan.sh 用 (该步暂时摘掉了, 见下面注释;
        # 留着装, 查清后接回来即可)
        sudo apt-get install -y clang llvm libbpf-dev linux-headers-generic iproute2 python3 nftables
    - name: 环境信息 (内核/BTF/cgroup — 失败时先看这里)
      run: |
        echo "kernel: $(uname -r)"
        ls -l /sys/kernel/btf/vmlinux 2>/dev/null || echo "⚠️ 无 BTF (aya CO-RE 可能失败)"
        echo "cgroup fs: $(stat -fc %T /sys/fs/cgroup 2>/dev/null || echo unknown)"
    - name: Build eBPF examples
      run: cargo build --features ebpf --examples --verbose
    # 每个验证器单独一步: 失败时一眼看出是哪个内核机制断了
    - name: tc_divert — 裸-IP UDP sk_assign + LPM 直连分流
      run: sudo bash examples/verify_tc_divert.sh
    - name: tc_divert TCP — 透明 local_addr 分水岭 (IP_TRANSPARENT)
      run: sudo bash examples/verify_tc_divert_tcp.sh
    # ⚠️ 不接 CI (本地-only, 2026-07-27 再确认): 本机 (≥6.1) 双 case 稳定绿, 但 GitHub runner
    # 上**5.15 和 6.8 都红** —— 拉 CI 日志 (gh run view --log-failed) 确认失败点是"客户端 8s
    # 重试后仍连不上" (非之前以为的瞬时 ENETUNREACH settle 竞态)。既然换 6.8 也红, 就不是内核
    # 版本问题, 是 runner 环境对本验证器"attach 进程(exit)与 listen 进程分离的跨进程 sk_assign"
    # 场景的兼容问题 (verify_tc_divert_tcp 单进程 attach+listen 故在 runner 绿)。盲调-push-等
    # 循环 ROI 太低, 故保持本地-only。产品正确性无缺口: 孤儿门控走的同一段 mark-gated 路由由
    # verify_tc_divert_tcp 在 5.15 CI 覆盖。本地跑: cargo build --features ebpf --example
    # verify_tc_divert_orphan && sudo bash examples/verify_tc_divert_orphan.sh (需内核 ≥6.1)。
    # 若日后要接回: 把验证器重写成单进程 attach+listen (仿 tcp.sh) 或许能解 runner 兼容。
    # - name: tc_divert 孤儿过滤器 — listener 没了不打 mark (停服不黑洞 LAN)
    #   run: sudo bash examples/verify_tc_divert_orphan.sh
    - name: cgroup/connect4 — 本机出向重定向 + origdst 还原
      run: sudo bash examples/verify_cgroup_connect.sh
    - name: sk_lookup UDP 透明 — origdst 报出 + 回包源伪造
      run: sudo bash examples/verify_udp_transparent.sh
    - name: XDP 极速 DNS — 收发改包 + BPF/用户态哈希一致 (端到端)
      run: sudo bash examples/verify_dns_xdp.sh

  # 供应链门禁: 安全公告 (RUSTSEC) + 许可证 + 依赖来源。见 deny.toml。
  supply-chain:
    name: 供应链 (cargo-deny)
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - name: cargo-deny check
      uses: EmbarkStudios/cargo-deny-action@v2
      with:
        command: check advisories bans licenses sources

  # Android 内核 (mirage-core → mirage-jni .so) 交叉编译门禁。
  #
  # 为什么在这里: Android 客户端 (github.com/zdgt0226/Mirage-android) 把本仓库的协议核
  # vendored 进 native/mirage-core (crypto/pool/outbound/tunnel/…), 由 mirage-jni 包成 .so。
  # 此 job 把**本仓库当前 commit** 的协议核 vendor-sync 进去再交叉编译 → 保证"当前协议永远
  # 是 Android 可编译的", 上游一改动破坏移动端裁剪边界当场红灯 (治 vendored 漂移的核心手段)。
  # 产出 arm64-v8a + x86_64 的 .so (16KB 页对齐 = Android 15+ 合规) + 跑 core 单测。
  #
  # ⚠️ Mirage-android 若为私有仓库: 在本仓库 Settings→Secrets→Actions 加 ANDROID_REPO_PAT
  #    (对 android 仓有 read 的 PAT 或 deploy token)。公开仓库则该 token 行可留空/删除。
  android-core:
    name: Android 内核交叉编译 (mirage-core → .so)
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Mirage-rs (协议核上游)
      uses: actions/checkout@v4
    - name: Checkout Mirage-android (客户端 + vendored 核)
      uses: actions/checkout@v4
      with:
        repository: zdgt0226/Mirage-android
        path: mirage-android
        token: ${{ secrets.ANDROID_REPO_PAT }}
    - name: Rust toolchain + Android targets
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android, x86_64-linux-android
    - name: Setup Android NDK (r26d = 26.3.11579264)
      id: ndk
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r26d
    - name: Install cargo-ndk
      run: cargo install cargo-ndk --version "^3" --locked
    - name: Vendor-sync 协议核 (对齐本仓库当前 commit) + 漂移预警
      working-directory: mirage-android
      run: |
        ./native/vendor-sync.sh "$GITHUB_WORKSPACE"
        drift=$(git status --porcelain native/mirage-core/src/vendor | grep -v 'SYNC.md' || true)
        if [ -n "$drift" ]; then
          echo "::warning::Mirage-android 里 vendored 核落后本仓库当前 commit —— 建议在 android 仓重跑 native/vendor-sync.sh 并提交。CI 已用最新协议核继续构建 (下面若红说明裁剪边界需调整)。"
          git --no-pager diff --stat -- native/mirage-core/src/vendor ':!*SYNC.md' || true
        else
          echo "vendored 核已与本仓库当前 commit 一致 ✓"
        fi
    - name: 交叉编译 mirage-jni (arm64-v8a + x86_64, 16KB 对齐)
      working-directory: mirage-android/native/mirage-jni
      env:
        ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
      run: cargo ndk -t arm64-v8a -t x86_64 -o "$GITHUB_WORKSPACE/jniLibs" build --release
    - name: 验 16KB 页对齐 (每个 .so 的 LOAD 段须 align=0x4000)
      run: |
        fail=0
        for so in $(find "$GITHUB_WORKSPACE/jniLibs" -name '*.so'); do
          aligns=$(readelf -lW "$so" | awk '/LOAD/{print $NF}' | sort -u | tr '\n' ' ')
          echo "$so: LOAD align = $aligns"
          echo "$aligns" | grep -qw '0x4000' || { echo "::error::$so 非 16KB 页对齐 (Android 15+ 会拒装)"; fail=1; }
        done
        exit $fail
    - name: mirage-core 单元测试
      working-directory: mirage-android/native/mirage-core
      run: cargo test --release
    - name: 上传 jniLibs (.so 产物)
      uses: actions/upload-artifact@v4
      with:
        name: mirage-jni-so
        path: jniLibs/**/*.so
        if-no-files-found: error
