name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 顶层最小权限; 需要写发布/推镜像/签名的 job 各自提权 (最小权限原则)。
permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    # Pin to 22.04 (glibc 2.35) so gnu binaries stay compatible with
    # Debian 12 / Ubuntu 22.04+ / RHEL 9+. ubuntu-latest moved to 24.04
    # (glibc 2.39) in 2025, which would silently raise our floor.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: amd64
            ebpf: true
          - target: aarch64-unknown-linux-gnu
            arch: arm64
            ebpf: true
          - target: x86_64-unknown-linux-musl
            arch: amd64-musl
            ebpf: true
          - target: aarch64-unknown-linux-musl
            arch: arm64-musl
            ebpf: true
          # === 32-bit targets (纯用户态, 无 ebpf) ===
          # 老式 x86 软路由/瘦客户机 与 ARMv7 路由器(OpenWrt/树莓派).
          # 这些设备内核多 <5.9, sk_lookup 透明代理不可用, 故不含 ebpf feature.
          - target: i686-unknown-linux-gnu
            arch: i386
            ebpf: false
          - target: i686-unknown-linux-musl
            arch: i386-musl
            ebpf: false
          - target: armv7-unknown-linux-gnueabihf
            arch: armv7
            ebpf: false
          - target: armv7-unknown-linux-musleabihf
            arch: armv7-musl
            ebpf: false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 需要全 tag 历史给 build.rs 的 git describe 用

      - name: Verify Cargo.toml version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          CARGO_VERSION=$(grep -E '^version\s*=' Cargo.toml | head -1 | cut -d'"' -f2)
          echo "Tag:        $TAG_VERSION"
          echo "Cargo.toml: $CARGO_VERSION"
          if [[ "$TAG_VERSION" != "$CARGO_VERSION" ]]; then
            echo "::error::版本不一致: tag v$TAG_VERSION ≠ Cargo.toml $CARGO_VERSION"
            echo "::error::请先 bump Cargo.toml version 再打 tag"
            exit 1
          fi
          echo "✓ 版本一致"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm llvm-dev libclang-dev protobuf-compiler libbpf-dev linux-headers-generic
          if [[ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          elif [[ "${{ matrix.target }}" == "armv7-unknown-linux-gnueabihf" ]]; then
            sudo apt-get install -y gcc-arm-linux-gnueabihf libc6-dev-armhf-cross
          elif [[ "${{ matrix.target }}" == "i686-unknown-linux-gnu" ]]; then
            sudo apt-get install -y gcc-multilib libc6-dev-i386
          elif [[ "${{ matrix.target }}" == *-musl* ]]; then
            # musl 目标一律走 cross-rs (容器内自带工具链)
            echo "We will use cross-rs for musl"
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (for musl cross-compilation)
        if: contains(matrix.target, 'musl')
        run: cargo install cross --git https://github.com/cross-rs/cross

      # === BPF compilation (shared by all targets) ===
      # Compile BPF objects on the runner with the runner's clang BEFORE running
      # cargo/cross build. This guarantees that:
      #   1) ebpf-src/*.elf is valid (overwrites any stale committed fallback)
      #   2) Even if cross container lacks clang and build.rs falls back to the
      #      committed path, the fallback content is fresh and valid.
      #   3) gnu build's build.rs has the same baseline (host clang) — eliminating
      #      pre-built binary divergence between runs.
      - name: Compile BPF objects (explicit)
        if: matrix.ebpf
        run: |
          set -euo pipefail
          uname_m=$(uname -m)
          mkdir -p ebpf-src
          for src in sockmap dns_xdp transparent; do
              echo "=== Compiling ebpf-src/${src}.c ==="
              clang -O2 -g -target bpf \
                  -I/usr/include/${uname_m}-linux-gnu \
                  -c ebpf-src/${src}.c \
                  -o ebpf-src/${src}.elf
              llvm-strip --strip-debug ebpf-src/${src}.elf
              # Hard verification — fail CI if any ELF is broken
              file ebpf-src/${src}.elf | tee /tmp/file_${src}.txt
              if ! grep -q "ELF.*eBPF" /tmp/file_${src}.txt; then
                  echo "FATAL: ebpf-src/${src}.elf is not a valid BPF ELF" >&2
                  exit 1
              fi
              readelf -h ebpf-src/${src}.elf | grep -E "Machine:.*Linux BPF" \
                  || { echo "FATAL: wrong machine type for ${src}.elf" >&2; exit 1; }
              size=$(stat -c%s ebpf-src/${src}.elf)
              if [ "$size" -lt 200 ]; then
                  echo "FATAL: ebpf-src/${src}.elf suspiciously small ($size bytes)" >&2
                  exit 1
              fi
              echo "✓ ${src}.elf: $size bytes, valid BPF ELF"
          done

      - name: Build Binary (Standard)
        if: "!contains(matrix.target, 'musl')"
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
        run: |
          set -euo pipefail
          cargo build --release --target ${{ matrix.target }} ${{ matrix.ebpf && '--features ebpf' || '' }}
          cp target/${{ matrix.target }}/release/mirage mirage-rs-${{ matrix.arch }}

      - name: Build Binary (Musl via Cross)
        if: contains(matrix.target, 'musl')
        run: |
          set -euo pipefail
          cross build --release --target ${{ matrix.target }} ${{ matrix.ebpf && '--features ebpf' || '' }}
          cp target/${{ matrix.target }}/release/mirage mirage-rs-${{ matrix.arch }}

      # Post-build: confirm the resulting binary actually embeds 3 ELF blobs
      - name: Verify embedded BPF ELFs in artifact
        if: matrix.ebpf
        run: |
          set -euo pipefail
          artifact="mirage-rs-${{ matrix.arch }}"
          echo "=== ELF magic occurrences in $artifact (expect ≥ 3 for sockmap/dns_xdp/transparent) ==="
          # ELF magic = \x7fELF. Use grep -aob to find all occurrences.
          count=$(grep -aoc $'\x7fELF' "$artifact" || echo 0)
          echo "Found $count ELF magic occurrences"
          if [ "$count" -lt 3 ]; then
              echo "FATAL: artifact missing embedded BPF ELFs (found $count, expected ≥ 3)" >&2
              exit 1
          fi
          echo "✓ artifact embeds ≥ 3 ELF blobs"

      - name: Generate SHA256
        run: |
          set -euo pipefail
          sha256sum mirage-rs-${{ matrix.arch }} > mirage-rs-${{ matrix.arch }}.sha256
          echo "--- $(cat mirage-rs-${{ matrix.arch }}.sha256) ---"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mirage-rs-${{ matrix.arch }}
          path: |
            mirage-rs-${{ matrix.arch }}
            mirage-rs-${{ matrix.arch }}.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write   # 创建 Release
      id-token: write   # cosign keyless (Sigstore OIDC), 无需任何密钥 secret
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      # 把 8 个 target 的二进制拍平到一层, 便于聚合 SHA256SUMS 与后续引用。
      - name: Flatten artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -type f -name 'mirage-rs-*' ! -name '*.sha256' -exec cp {} dist/ \;
          ls -l dist

      # 聚合校验和到单文件 SHA256SUMS (basename 相对, 用户下载后同目录 `sha256sum -c` 可校验)。
      - name: Aggregate SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          sha256sum mirage-rs-* > SHA256SUMS
          echo "=== SHA256SUMS ==="; cat SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # cosign **keyless** 签名 (Fulcio 短时证书 + Rekor 透明日志), 身份 = 本 workflow 的 OIDC。
      # 产出 bundle (含签名+证书+Rekor 记录), 一文件即可验, 无需任何长期私钥。
      - name: Sign SHA256SUMS (cosign keyless)
        run: |
          set -euo pipefail
          cd dist
          cosign sign-blob --yes \
            --bundle SHA256SUMS.cosign.bundle \
            SHA256SUMS
          echo "=== bundle ==="; ls -l SHA256SUMS.cosign.bundle

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/mirage-rs-*
            dist/SHA256SUMS
            dist/SHA256SUMS.cosign.bundle
          generate_release_notes: true
          body: |
            ## 校验产物 (cosign keyless, 无需密钥)

            ```bash
            # 1) 验证 SHA256SUMS 的签名 (身份 = 本仓库 Release workflow, 签发者 = GitHub OIDC)
            cosign verify-blob \
              --bundle SHA256SUMS.cosign.bundle \
              --certificate-identity-regexp '^https://github.com/${{ github.repository }}/\.github/workflows/release\.yml@refs/tags/' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              SHA256SUMS
            # 2) 校验二进制哈希
            sha256sum -c SHA256SUMS --ignore-missing
            ```

            容器镜像: `ghcr.io/${{ github.repository }}:${{ github.ref_name }}` (multi-arch amd64/arm64, 亦经 cosign keyless 签名)。

  # === 多架构容器镜像 → ghcr.io (GITHUB_TOKEN 推送, cosign keyless 签名; 零密钥) ===
  container:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write   # 推 ghcr
      id-token: write   # cosign 签镜像
    steps:
      - uses: actions/checkout@v4   # 取 Dockerfile

      # 只用 musl 静态二进制 (无 glibc 依赖, 配 alpine 最小基镜)。amd64 + arm64。
      - uses: actions/download-artifact@v4
        with:
          pattern: mirage-rs-*-musl
          path: artifacts

      - name: Stage binaries for build context
        run: |
          set -euo pipefail
          cp artifacts/mirage-rs-amd64-musl/mirage-rs-amd64-musl ./mirage-rs-amd64-musl
          cp artifacts/mirage-rs-arm64-musl/mirage-rs-arm64-musl ./mirage-rs-arm64-musl
          chmod +x mirage-rs-amd64-musl mirage-rs-arm64-musl

      - uses: docker/setup-qemu-action@v3   # arm64 emulation for buildx
      - uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata (tags)
        id: meta
        run: |
          set -euo pipefail
          repo_lc="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${repo_lc}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build & push (multi-arch)
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          provenance: false

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (cosign keyless)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE: ${{ steps.meta.outputs.image }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
